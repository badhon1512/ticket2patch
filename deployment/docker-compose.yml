services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket2patch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket2patch
      POSTGRES_USER: ticket2patch
      POSTGRES_PASSWORD: ticket2patch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ticket2patch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket2patch -d ticket2patch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticket2patch_postgres_data:
